name: Imajlari GHCR'a aynala

# Lablarda kullanilan Docker Hub imajlarini GHCR'a kopyalar.
#
# NEDEN: Docker Hub anonim cekmeyi IP basina 6 saatte 100 istekle
# siniriyor. Lablarda 119 Docker Hub imaji var; tek bir ogrenci bir
# track'i bastan sona yaparken bu siniri asabiliyor, ayni NAT arkasindaki
# bir sinif ise ilk dakikalarda doldurup "toomanyrequests" aliyor ve ders
# duruyor. GHCR'da anonim cekme siniri yok.
#
# NEDEN ACTIONS: GitHub runner'lari bu sinira takilmiyor ve dogrudan
# GHCR'a push edebiliyor; aynalama yerelde yapilamiyor cunku kopyalamak
# icin once Docker Hub'dan cekmek gerekiyor - yani ayni sinir.
#
# Arac crane: cok mimarili index'i ve digest'leri OLDUGU GIBI kopyaliyor.
# "docker pull + push" ise tek mimariye indirger ve Apple Silicon
# ogrencilerde lab bozulurdu.

on:
  workflow_dispatch:
    inputs:
      only:
        description: 'Yalnizca bu metni iceren imajlar (bos: hepsi)'
        default: ''
  push:
    branches: [main]
    paths:
      - 'mirror/images.txt'
      - '.github/workflows/mirror-images.yml'

permissions:
  # contents: write -> basarili aynalamalarin listesini (mirror/mirrored.txt)
  # repoya geri yaziyoruz. Lab referanslarini guncelleyen betik SADECE o
  # listeyi kullaniyor: aynalanamamis bir imaja yonlendirmek labi tamamen
  # bozardi, aynalama listesinin kusursuz olmasina guvenmek yerine
  # gercekten basarili olanlari kaydediyoruz.
  contents: write
  packages: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: crane kur
        uses: imjasonh/setup-crane@v0.4

      - name: GHCR'a giris
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | crane auth login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Eslemeyi uret
        id: map
        run: |
          python3 tools/mirror_map.py < mirror/images.txt > /tmp/map.tsv
          if [ -n "${{ inputs.only }}" ]; then
            grep -- "${{ inputs.only }}" /tmp/map.tsv > /tmp/filtered.tsv || true
            mv /tmp/filtered.tsv /tmp/map.tsv
          fi
          echo "adet=$(wc -l < /tmp/map.tsv)" >> "$GITHUB_OUTPUT"
          echo "Aynalanacak: $(wc -l < /tmp/map.tsv) imaj"

      - name: Kopyala
        run: |
          # YAML'da gercek sekme karakteri kullanilamiyor (ayristirici
          # reddediyor), o yuzden ayraci burada uretiyoruz.
          TAB=$(printf '\t')
          ok=0; fail=0
          : > /tmp/failed.txt
          : > /tmp/ok.tsv
          # orig = referansin lab dosyalarindaki yazimi; kayda bu giriyor
          # cunku referanslari guncelleyen betik dosyalarda onu ariyor.
          while IFS=$'\t' read -r src dst orig; do
            [ -z "$src" ] && continue
            # Zaten aynalanmissa ve digest ayniysa tekrar kopyalamiyoruz:
            # 119 imajin her calismada yeniden itilmesi gereksiz.
            if crane digest "$dst" >/dev/null 2>&1 \
               && [ "$(crane digest "$src" 2>/dev/null)" = "$(crane digest "$dst" 2>/dev/null)" ]; then
              echo "= guncel  $dst"
              echo "${orig}${TAB}${dst}" >> /tmp/ok.tsv
              ok=$((ok+1)); continue
            fi
            # Bir kez tekrar deniyoruz: GHCR, cok sayida paket ayni anda
            # ilk kez olusturulurken ara sira gecici "DENIED: requested
            # access to the resource is denied" donduruyor. amazoncorretto:8
            # tam bunu yasadi ve tek basina tekrar calistirildiginda
            # sorunsuz kopyalandi. Kalici hatalar (sema v1 manifest, var
            # olmayan etiket) tekrarda da ayni sonucu veriyor, yani tekrar
            # onlari maskelemiyor.
            if crane copy "$src" "$dst" 2>/tmp/err.txt \
               || { sleep 5; crane copy "$src" "$dst" 2>/tmp/err.txt; }; then
              echo "+ kopyalandi  $src -> $dst"
              echo "${orig}${TAB}${dst}" >> /tmp/ok.tsv
              ok=$((ok+1))
            else
              echo "! BASARISIZ   $src"
              sed 's/^/      /' /tmp/err.txt | tail -2
              echo "$src" >> /tmp/failed.txt
              fail=$((fail+1))
            fi
          done < /tmp/map.tsv

          echo
          echo "========================================"
          echo "basarili : $ok"
          echo "basarisiz: $fail"
          echo "========================================"
          if [ "$fail" -gt 0 ]; then
            echo
            echo "Kopyalanamayan imajlar (lablarda Docker Hub'dan cekilmeye devam edecek):"
            cat /tmp/failed.txt
          fi
          # Basarisizlik is akisini DURDURMUYOR: 93 imajin 90'i
          # aynalandiysa o 90'i kullanmak istiyoruz. Basarisiz olanlar
          # mirrored.txt'e girmedigi icin referanslari degistirilmiyor.
          cp /tmp/ok.tsv mirror/mirrored.tsv

      - name: Basarili aynalamalari repoya yaz
        run: |
          # Filtreli calistirma (only=...) imajlarin yalnizca bir
          # ALTKUMESINI biliyor; listeyi onunla degistirmek digerlerinin
          # kaydini siler. "only=amazoncorretto" ile tek imaji tekrar
          # denedigimizde tam bu oldu: 82 kayitlik liste 1 kayda dustu ve
          # referans guncelleyen betik oburlerini gormez hale geldi.
          # Filtreli calistirma artik kendi sonuclarini listeye EKLIYOR;
          # yalnizca filtresiz calistirma tam gercegi temsil ettigi icin
          # listeyi bastan yaziyor.
          if [ -n "${{ inputs.only }}" ] && [ -f mirror/mirrored.txt ]; then
            grep -v '^#' mirror/mirrored.txt >> mirror/mirrored.tsv || true
          fi
          {
            echo "# Gercekten aynalanmis imajlar, sekme ayracli: kaynak<TAB>GHCR-hedefi"
            echo "# Bu dosyayi is akisi uretir; elle duzenlenmez."
            echo "# tools/use-mirror.py yalnizca buradakileri degistirir."
            sort -u mirror/mirrored.tsv
          } > mirror/mirrored.txt
          rm -f mirror/mirrored.tsv
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mirror/mirrored.txt
          # Degisiklik kontrolu add'DEN SONRA ve --cached ile yapilmali:
          # "git diff --quiet" izlenmeyen bir dosyada "fark yok" donuyor,
          # bu yuzden dosya ilk olusturuldugunda commit atlaniyordu ve
          # mirrored.txt hic yazilmadi.
          if git diff --cached --quiet -- mirror/mirrored.txt; then
            echo "degisiklik yok"
            exit 0
          fi
          git commit -m "mirror: basarili aynalama listesini guncelle [skip ci]"
          git push

      - name: Paketleri herkese acik yap
        # GHCR paketleri varsayilan olarak OZEL olusur; ogrencinin anonim
        # cekebilmesi icin herkese acik olmalari gerekiyor.
        # GITHUB_TOKEN kullanici paketlerinin gorunurlugunu degistiremiyor,
        # o yuzden GHCR_PAT (write:packages yetkili) varsa o kullaniliyor.
        # Yoksa adim hata vermeden atlanir ve ne yapilmasi gerektigi yazilir.
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}
          HAS_PAT: ${{ secrets.GHCR_PAT != '' }}
        run: |
          if [ "$HAS_PAT" != "true" ]; then
            echo "GHCR_PAT tanimli degil."
            echo "Paketler OZEL olusur; ogrenci anonim cekemez."
            echo "Cozum: write:packages yetkili bir token uretip bu reponun"
            echo "Settings > Secrets > Actions bolumune GHCR_PAT adiyla ekle"
            echo "ve bu is akisini tekrar calistir."
            exit 0
          fi
          cut -f2 /tmp/map.tsv | sed 's|^ghcr.io/[^/]*/||; s|:.*$||' | sort -u \
          | while read -r pkg; do
              enc=$(printf '%s' "$pkg" | sed 's|/|%2F|g')
              if gh api --method PATCH "/user/packages/container/$enc" \
                   -f visibility=public >/dev/null 2>&1; then
                echo "+ acik  $pkg"
              else
                echo "! degistirilemedi  $pkg"
              fi
            done
