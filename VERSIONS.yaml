  golang:
    image: golang
    tag: 1.27.2-alpine
    was: golang:1.16.4-alpine
  ubuntu:
    image: ubuntu
    tag: "26.04"
    note: LTS. Upstream'de pinlenmemisti ('FROM ubuntu').
  alpine:
    image: alpine
    tag: "3.24"
    was: alpine:3.13
  nginx:
    image: nginx
    tag: 1.31.7-alpine
  redis:
    image: redis
    tag: 8.10.2-alpine
    was: redis:6.2.4-alpine

# ---------------------------------------------------------------- Kendi imajlarimiz
# Ozel yapilandirma gereken bilesenler (eklentili Jenkins, tohumlanmis Git
# sunucusu vb.) GHCR'da bizim namespace'imizde yayinlanir. Boylece Docker Hub
# anonim cekme limiti siniftaki 20 ogrenciyi kilitlemez.
own_images:
  registry: ghcr.io/yasinoz
  images:
    labs-jenkins:
      source: images/jenkins
      base: jenkins/jenkins:2.580.1-lts-jdk21
      # 1.0.1: casc.yaml'da authorizationStrategy sembolu hataliydi
      # (loggedInAuthenticationStrategy), Jenkins hic acilmiyordu. 1.0.0'i
      # ceken makinelerde bozuk imaj onbellekte kalmasin diye etiket yukseldi.
      # 1.0.2: docker CLI eklentileri (compose, buildx) imaja kopyalanmiyordu;
      # pipeline labinin 'docker compose build' adimi calismiyordu.
      tag: "1.0.2"
    labs-gitea:
      source: images/gitea
      base: gitea/gitea:28.2.0
      tag: "1.0.0"

# ---------------------------------------------------------------- Kasitli eski imajlar
# BUNLARI GUNCELLEMEYIN. Tarama/analiz lablari bu imajlardaki gercek CVE'leri
# bulmak uzere kurgulandi; guncellenirse lab anlamsiz hale gelir.
intentionally_vulnerable:
  - image: nginx:1.7
    used_by: [labs/scanning]
    reason: Trivy taramasinda yuzlerce CVE gostermek icin
  - image: alpine:3.8
    used_by: [labs/scanning, labs/golden-images]
    reason: Temel katman aciklarini gostermek icin
  - image: python:3.4-alpine
    used_by: [labs/scanning]
    reason: CVE-2019-15903 dahil kritik bulgular icin
  - image: openjdk:8-jre-alpine
    used_by: [labs/golden-images]
    reason: Eski temel imaj / altin imaj kiyaslamasi icin
